[package]
name = "atlas-server"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
atlas-core = { path = "../atlas-core" }
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-stream = "0.3"
rmcp = { version = "=3.9.0", features = ["transport-streamable-http-server"] }
tower-http = { version = "0.6", features = ["limit"] }
rand = "0.8"
[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
rmcp = { version = "=3.9.0", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3"
