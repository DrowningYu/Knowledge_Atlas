[package]
name = "knowledge-atlas"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "knowledge-atlas"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
atlas-core = { path = "../crates/atlas-core" }
atlas-server = { path = "../crates/atlas-server" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
