name: Verify and build desktop installers
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked -p atlas-core -p atlas-server
      - run: cargo build --locked -p atlas-server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: artifacts/tests/
          if-no-files-found: ignore
  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            label: Windows-x64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            label: macOS-Intel
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            label: macOS-Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      - run: cargo test --locked -p atlas-core -p atlas-server
      - run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: Knowledge-Atlas-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
