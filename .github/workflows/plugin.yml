name: Verify ChatGPT plugin
on:
  push:
    branches: [chatgpt-plugin]
  pull_request:
    paths: ['plugins/**', 'scripts/package-plugin.py', 'tests/plugin*', '.agents/plugins/**', '.github/workflows/plugin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p atlas-server
      - name: Test adapter
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/plugin-test
          node tests/plugin.mjs 2>&1 | tee artifacts/plugin-test/result.txt
      - name: Test plugin packaging
        shell: bash
        run: |
          set -o pipefail
          python tests/plugin-package.py 2>&1 | tee artifacts/plugin-test/packaging.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-test-${{ runner.os }}
          path: artifacts/plugin-test/
          if-no-files-found: ignore
      - run: python scripts/package-plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-atlas-desktop-plugin-${{ runner.os }}
          path: artifacts/plugins/*.zip
