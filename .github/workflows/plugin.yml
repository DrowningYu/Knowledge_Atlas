name: Verify ChatGPT plugin
on:
  push:
    branches: [chatgpt-plugin]
  pull_request:
    paths: ['plugins/**', 'scripts/package-plugin.py', 'tests/plugin*', '.agents/plugins/**', '.github/workflows/plugin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p atlas-server
      - run: node tests/plugin.mjs
      - run: python tests/plugin-package.py
      - run: python scripts/package-plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-atlas-desktop-plugin-${{ runner.os }}
          path: artifacts/plugins/*.zip
